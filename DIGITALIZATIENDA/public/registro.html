<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitaliza Tu Tienda — Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/logo.png" alt="Logo">
      <h1>Crear Cuenta</h1>
      <p>Regístrate en el sistema</p>
    </div>
    <div id="msg-box" style="display:none;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px;"></div>
    <form id="reg-form">
      <div class="form-group" style="margin-bottom:14px;">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
      </div>
      <div class="form-group" style="margin-bottom:22px;">
        <label>Contraseña (mín. 6 caracteres)</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
        ✅ Crear cuenta
      </button>
    </form>
    <div class="auth-footer"><a href="/">← Volver al inicio de sesión</a></div>
  </div>
</div>
<script>
document.getElementById('reg-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const box = document.getElementById('msg-box');
  btn.disabled = true; btn.textContent = 'Registrando…';
  box.style.display = 'none';
  try {
    const res = await fetch('/api/auth/registro', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: document.getElementById('nombre').value, email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) {
      box.style.cssText = 'display:block;background:var(--danger-lt);color:var(--danger);border:1px solid #f5b8b8;';
      box.textContent = data.error; return;
    }
    box.style.cssText = 'display:block;background:var(--success-lt);color:var(--success);border:1px solid #b6dfc4;';
    box.textContent = '¡Cuenta creada! Redirigiendo…';
    setTimeout(() => window.location.href = '/', 1500);
  } catch { box.textContent = 'Error de conexión.'; box.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = '✅ Crear cuenta'; }
});
</script>
</body>
</html>
