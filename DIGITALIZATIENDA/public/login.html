<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitaliza Tu Tienda — Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/logo.png" alt="Logo">
      <h1>Digitaliza Tu Tienda</h1>
      <p>Sistema de Gestión de Inventario</p>
    </div>

    <div id="error-box" style="display:none;background:var(--danger-lt);color:var(--danger);border:1px solid #f5b8b8;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px;"></div>

    <form id="login-form">
      <div class="form-group" style="margin-bottom:16px;">
        <label>Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@sistema.com" required autocomplete="email">
      </div>
      <div class="form-group" style="margin-bottom:22px;">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
        🔐 Iniciar Sesión
      </button>
    </form>

    <div class="auth-footer">¿No tienes cuenta? <a href="/registro">Regístrate aquí</a></div>
    <div class="auth-hint">Demo: admin@sistema.com / admin123</div>
    <div style="text-align:center;"><span class="brand-badge">🔒 Autenticación JWT segura</span></div>
  </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  const errBox = document.getElementById('error-box');
  errBox.style.display = 'none';
  btn.textContent = 'Ingresando…'; btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) { errBox.textContent = data.error || 'Error al iniciar sesión.'; errBox.style.display = 'block'; return; }
    window.location.href = '/dashboard';
  } catch { errBox.textContent = 'Error de conexión.'; errBox.style.display = 'block'; }
  finally { btn.textContent = '🔐 Iniciar Sesión'; btn.disabled = false; }
});
</script>
</body>
</html>
